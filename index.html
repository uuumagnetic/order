<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極速叫貨單生成系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; font-size: 16px; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .export-card-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background-color: #ffffff;
        }
        .export-card-table th, .export-card-table td {
            border: 1.5px solid #0f172a;
            padding: 4px 6px;
            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            box-sizing: border-box;
        }
        .export-spec-item {
            display: inline-block;
            white-space: nowrap;
            margin-right: 5px;
            margin-bottom: 2px;
        }
        .modal-scroll-area {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="pb-28 min-h-screen">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> 極速叫貨單生成系統
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="checkHistoryAuthAndOpen()" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl font-bold transition active:scale-95 shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i>歷史紀錄
                    <span id="history-badge" class="bg-amber-500 text-slate-900 text-xs px-2 py-0.5 rounded-full font-black">0</span>
                </button>
                <button onclick="saveMemory()" class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl font-bold transition active:scale-95 shadow">
                    <i class="fa-solid fa-bookmark mr-1"></i>儲存常用
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-3 space-y-4">
        <!-- 主畫面輸入區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-base font-black text-slate-900 flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-slate-700 inline-block shadow-sm"></span> 衣褲類 (件)
                    </span>
                    <button type="button" onclick="addClothesGroup()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl border border-slate-300 transition active:scale-95">
                        <i class="fa-solid fa-plus mr-1"></i>新增衣褲型號
                    </button>
                </div>
                <div id="clothes-entry-container" class="space-y-2"></div>
            </div>

            <hr class="border-slate-200">

            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-base font-black text-slate-900 flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-slate-700 inline-block shadow-sm"></span> 內褲類 (打)
                    </span>
                    <button type="button" onclick="addUnderwearGroup()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl border border-slate-300 transition active:scale-95">
                        <i class="fa-solid fa-plus mr-1"></i>新增內褲型號
                    </button>
                </div>
                <div id="underwear-entry-container" class="space-y-2"></div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div>
                        <label class="block font-bold text-slate-600 mb-1.5"><i class="fa-solid fa-truck text-indigo-500 mr-1"></i>物流單位</label>
                        <select id="logistics-select" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                            <option value="大榮貨運" selected>大榮貨運</option>
                            <option value="新竹物流">新竹物流</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-600 mb-1.5"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>目的地點</label>
                        <input type="text" id="location-input" value="新莊" placeholder="例: 新莊" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div>
                        <label class="block font-bold text-slate-600 mb-1.5"><i class="fa-regular fa-calendar-days text-indigo-500 mr-1"></i>叫貨日期</label>
                        <input type="date" id="order-date" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-600 mb-1.5"><i class="fa-solid fa-clock text-amber-500 mr-1"></i>到貨要求</label>
                        <select id="delivery-requirement" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 font-bold text-red-600 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                            <option value="明日到" selected>明日到</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部固定列：檢視即時預覽卡片按鈕 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 shadow-2xl z-30">
        <div class="max-w-md mx-auto">
            <button onclick="togglePreviewModal(true)" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-black py-3.5 px-4 rounded-2xl shadow-lg transition active:scale-98 flex items-center justify-center gap-2 text-sm cursor-pointer border border-slate-800">
                <i class="fa-solid fa-layer-group text-base"></i> 檢視即時預覽卡片（複製與完成叫貨）
            </button>
        </div>
    </div>

    <!-- 彈出預覽卡片視窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white w-full max-w-md rounded-2xl max-h-[88vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-3.5 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-black flex items-center gap-2">
                    <i class="fa-solid fa-eye text-amber-400"></i> 即時預覽卡片與操作
                </h2>
                <button onclick="togglePreviewModal(false)" class="text-slate-400 hover:text-white p-1 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-3 modal-scroll-area flex-1 bg-slate-50 space-y-3 flex flex-col items-center">
                <!-- 預覽卡片容器 -->
                <div id="preview-card-wrapper" class="shrink-0 flex justify-center w-full"></div>

                <div class="space-y-2 w-full pt-1 shrink-0 pb-2">
                    <button onclick="finishOrderAndSaveHistory()" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-black py-3 px-4 rounded-xl shadow-md transition active:scale-98 flex items-center justify-center gap-2 text-sm cursor-pointer border border-slate-800">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i> 完成已叫貨（存入雲端歷史紀錄）
                    </button>
                    <div class="flex items-center gap-2">
                        <button onclick="copyImageToClipboardOnly()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-98 text-white font-black py-3 px-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                            <i class="fa-solid fa-copy text-base"></i> 複製叫貨圖片（發送 LINE）
                        </button>
                        <button onclick="downloadImageFile()" title="下載圖片檔" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold p-3 px-4 rounded-xl transition active:scale-95 flex items-center justify-center shadow-xs">
                            <i class="fa-solid fa-download text-base"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-200 shrink-0">
                <button onclick="togglePreviewModal(false)" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
                    關閉預覽
                </button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄列表彈窗 -->
    <div id="history-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-black flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> 雲端叫貨歷史紀錄
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="clearAllHistory()" class="text-xs text-red-400 hover:text-red-300 font-bold px-2.5 py-1 bg-slate-800 rounded-lg border border-slate-700 transition">
                        <i class="fa-solid fa-trash-can mr-1"></i>清空
                    </button>
                    <button onclick="toggleHistoryModal(false)" class="text-slate-400 hover:text-white p-1 text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="p-3 bg-slate-100 border-b border-slate-200 shrink-0">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="history-search-input" oninput="renderHistoryList()" placeholder="搜尋型號、地點、物流或日期..." class="w-full bg-white border-2 border-slate-300 rounded-xl pl-9 pr-3 py-2 text-sm font-bold text-slate-900 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div id="history-list-container" class="p-2.5 overflow-y-auto space-y-2 flex-1 bg-slate-50">
                <div class="text-center py-8 text-slate-400 text-sm">正在載入雲端紀錄...</div>
            </div>

            <div class="p-3 bg-white border-t border-slate-200 text-center shrink-0">
                <button onclick="toggleHistoryModal(false)" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄詳情彈窗 -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-white w-full max-w-sm rounded-2xl max-h-[80vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-3.5 flex justify-between items-center border-b border-slate-800 shrink-0">
                <h3 class="text-sm font-black flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-amber-400"></i> 歷史叫貨單詳細資料
                </h3>
                <button onclick="toggleDetailModal(false)" class="text-slate-400 hover:text-white p-1 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="detail-content-body" class="p-3.5 overflow-y-auto space-y-3 text-sm bg-slate-50 flex-1"></div>
            <div class="p-3 bg-white border-t border-slate-200 flex gap-2 shrink-0">
                <button id="detail-reload-btn" class="flex-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-2.5 rounded-xl text-sm transition">
                    載入此筆至編輯區
                </button>
                <button onclick="toggleDetailModal(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-sm transition">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2.5 border border-slate-700 backdrop-blur-sm">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i> <span id="toast-msg">已複製叫貨圖！至 LINE 貼上即可</span>
    </div>

    <script>
        const clothesSizes = ['M', 'L', 'XL', '2XL', '3XL'];
        const underwearSizes = ['M', 'L', 'XL', '2XL'];

        let clothesData = [
            { model: 'K-555', items: [{ size: '3XL', color: '黑', qty: 30 }] },
            { model: 'K-611', items: [{ size: 'XL', color: '深灰', qty: 1 }] },
            { model: 'K-150', items: [{ size: '2XL', color: '深灰', qty: 2 }] }
        ];

        let underwearData = [
            { model: 'K-999', items: [{ size: 'L', qty: 1 }, { size: 'XL', qty: 2 }] },
            { model: 'K-868', items: [{ size: '2XL', qty: 2 }] },
            { model: 'K-858', items: [{ size: 'L', qty: 2 }] }
        ];

        let historyRecords = [];

        function checkHistoryAuthAndOpen() {
            const isAuth = localStorage.getItem('history_authed_v1');
            if (isAuth === 'true') {
                toggleHistoryModal(true);
            } else {
                const pwd = prompt("請輸入歷史紀錄查看密碼：");
                if (pwd === '922560') {
                    localStorage.setItem('history_authed_v1', 'true');
                    toggleHistoryModal(true);
                } else if (pwd !== null) {
                    alert("密碼錯誤！無法查看歷史紀錄。");
                }
            }
        }

        function togglePreviewModal(show) {
            const modal = document.getElementById('preview-modal');
            if (show) {
                updatePreview();
                modal.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function loadMemory() {
            const sc = localStorage.getItem('ultra_c_v8');
            const su = localStorage.getItem('ultra_u_v8');
            if (sc && su) {
                try {
                    clothesData = JSON.parse(sc);
                    underwearData = JSON.parse(su);
                } catch(e) {}
            }
            document.getElementById('order-date').valueAsDate = new Date();
            renderInputs();
            fetchCloudHistory();
        }

        async function fetchCloudHistory() {
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b/6acc92dcffd5d16053637f98/latest', {
                    headers: { 
                        'X-Master-Key': '$2a$10$CiO6ioiPvSncqvUg6oUNl.q.3OKFbPu5mxjpFW7pZ/kR.lCqvng1C'
                    }
                });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    historyRecords = data.record;
                } else if (data.record && Array.isArray(data.record.record)) {
                    historyRecords = data.record.record;
                } else {
                    historyRecords = [];
                }
                updateHistoryBadge();
            } catch(e) {
                console.error("載入雲端歷史失敗", e);
            }
        }

        async function saveCloudHistory() {
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b/6acc92dcffd5d16053637f98', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': '$2a$10$CiO6ioiPvSncqvUg6oUNl.q.3OKFbPu5mxjpFW7pZ/kR.lCqvng1C'
                    },
                    body: JSON.stringify({ record: historyRecords })
                });
                if (response.ok) {
                    updateHistoryBadge();
                    showToast("已完成並同步至雲端歷史紀錄！", "fa-circle-check", "text-emerald-400");
                } else {
                    console.error("JSONbin 寫入回應錯誤", await response.text());
                    showToast("雲端同步失敗，請檢查格式或權限", "fa-triangle-exclamation", "text-amber-400");
                }
            } catch(e) {
                console.error("雲端同步失敗", e);
                showToast("網路錯誤，無法同步雲端", "fa-triangle-exclamation", "text-amber-400");
            }
        }

        function saveMemory() {
            localStorage.setItem('ultra_c_v8', JSON.stringify(clothesData));
            localStorage.setItem('ultra_u_v8', JSON.stringify(underwearData));
            showToast("已成功儲存常用叫貨設定！", "fa-circle-check", "text-emerald-400");
        }

        function updateHistoryBadge() {
            document.getElementById('history-badge').innerText = historyRecords.length;
        }

        function showToast(msg, icon = "fa-circle-check", colorClass = "text-emerald-400") {
            const t = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            toastIcon.className = `fa-solid ${icon} ${colorClass}`;
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        function renderInputs() {
            const cContainer = document.getElementById('clothes-entry-container');
            cContainer.innerHTML = clothesData.map((g, gIdx) => `
                <div class="bg-slate-50 p-2.5 rounded-2xl border-2 border-slate-200 space-y-2">
                    <div class="flex justify-between items-center pb-1.5 border-b border-slate-200">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-bold text-slate-700">型號：</span>
                            <input type="text" value="${g.model}" onchange="clothesData[${gIdx}].model=this.value; updatePreview();" placeholder="例:K-555" class="w-28 bg-white border-2 border-slate-300 rounded-xl px-2 py-1 text-sm font-black text-slate-900 outline-none">
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="addClothesSubItem(${gIdx})" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1 rounded-lg font-bold transition active:scale-95">＋顏色/尺寸</button>
                            <button onclick="clothesData.splice(${gIdx},1); renderInputs();" class="text-slate-400 hover:text-red-500 p-1 text-sm"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        ${g.items.map((sub, sIdx) => `
                            <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-slate-200 text-sm">
                                <select onchange="clothesData[${gIdx}].items[${sIdx}].size=this.value; updatePreview();" class="bg-slate-50 border border-slate-300 rounded-lg px-1.5 py-1 font-bold text-slate-900 shrink-0 text-sm">
                                    ${clothesSizes.map(s => `<option ${sub.size===s?'selected':''}>${s}</option>`).join('')}
                                </select>
                                <input type="text" value="${sub.color}" onchange="clothesData[${gIdx}].items[${sIdx}].color=this.value; updatePreview();" placeholder="顏色" class="w-14 bg-slate-50 border border-slate-300 rounded-lg px-1.5 py-1 font-bold text-slate-900 shrink-0 text-sm text-center">
                                <div class="flex items-center gap-1 ml-auto shrink-0">
                                    <button onclick="adjustQty('clothes', ${gIdx},${sIdx}, -1)" class="w-6 h-6 bg-slate-100 text-slate-800 hover:bg-slate-200 rounded font-bold flex items-center justify-center text-sm shrink-0">-</button>
                                    <input type="number" value="${sub.qty}" onchange="clothesData[${gIdx}].items[${sIdx}].qty=Number(this.value); updatePreview();" class="w-10 bg-slate-50 border border-slate-300 rounded py-0.5 font-black text-center text-slate-900 text-sm shrink-0">
                                    <button onclick="adjustQty('clothes', ${gIdx},${sIdx}, 1)" class="w-6 h-6 bg-slate-100 text-slate-800 hover:bg-slate-200 rounded font-bold flex items-center justify-center text-sm shrink-0">+</button>
                                    <span class="text-xs font-bold text-slate-600 shrink-0">件</span>
                                    <button onclick="clothesData[${gIdx}].items.splice(${sIdx},1); renderInputs();" class="text-slate-400 hover:text-red-500 ml-1 p-1 shrink-0"><i class="fa-solid fa-xmark text-sm"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            const uContainer = document.getElementById('underwear-entry-container');
            uContainer.innerHTML = underwearData.map((g, gIdx) => `
                <div class="bg-slate-50 p-2.5 rounded-2xl border-2 border-slate-200 space-y-2">
                    <div class="flex justify-between items-center pb-1.5 border-b border-slate-200">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-bold text-slate-700">型號：</span>
                            <input type="text" value="${g.model}" onchange="underwearData[${gIdx}].model=this.value; updatePreview();" placeholder="例:K-999" class="w-28 bg-white border-2 border-slate-300 rounded-xl px-2 py-1 text-sm font-black text-slate-900 outline-none">
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="addUnderwearSubItem(${gIdx})" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1 rounded-lg font-bold transition active:scale-95">＋尺寸/打數</button>
                            <button onclick="underwearData.splice(${gIdx},1); renderInputs();" class="text-slate-400 hover:text-red-500 p-1 text-sm"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        ${g.items.map((sub, sIdx) => `
                            <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-slate-200 text-sm">
                                <select onchange="underwearData[${gIdx}].items[${sIdx}].size=this.value; updatePreview();" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-1.5 py-1 font-bold text-slate-900 shrink-0 text-sm min-w-[70px]">
                                    ${underwearSizes.map(s => `<option ${sub.size===s?'selected':''}>${s}</option>`).join('')}
                                </select>
                                <div class="flex items-center gap-1 ml-auto shrink-0">
                                    <button onclick="adjustQty('underwear', ${gIdx},${sIdx}, -1)" class="w-6 h-6 bg-slate-100 text-slate-800 hover:bg-slate-200 rounded font-bold flex items-center justify-center text-sm shrink-0">-</button>
                                    <input type="number" value="${sub.qty}" onchange="underwearData[${gIdx}].items[${sIdx}].qty=Number(this.value); updatePreview();" class="w-10 bg-slate-50 border border-slate-300 rounded py-0.5 font-black text-center text-slate-900 text-sm shrink-0">
                                    <button onclick="adjustQty('underwear', ${gIdx},${sIdx}, 1)" class="w-6 h-6 bg-slate-100 text-slate-800 hover:bg-slate-200 rounded font-bold flex items-center justify-center text-sm shrink-0">+</button>
                                    <span class="text-xs font-bold text-slate-600 shrink-0">打</span>
                                    <button onclick="underwearData[${gIdx}].items.splice(${sIdx},1); renderInputs();" class="text-slate-400 hover:text-red-500 ml-1 p-1 shrink-0"><i class="fa-solid fa-xmark text-sm"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updatePreview();
        }

        function addClothesGroup() {
            clothesData.push({ model: 'K-', items: [{ size: '3XL', color: '黑', qty: 1 }] });
            renderInputs();
        }
        function addClothesSubItem(gIdx) {
            clothesData[gIdx].items.push({ size: 'XL', color: '', qty: 1 });
            renderInputs();
        }
        function addUnderwearGroup() {
            underwearData.push({ model: 'K-', items: [{ size: 'L', qty: 1 }] });
            renderInputs();
        }
        function addUnderwearSubItem(gIdx) {
            underwearData[gIdx].items.push({ size: 'XL', qty: 1 });
            renderInputs();
        }
        function adjustQty(type, gIdx, sIdx, delta) {
            if (type === 'clothes') {
                clothesData[gIdx].items[sIdx].qty = Math.max(0, (clothesData[gIdx].items[sIdx].qty || 0) + delta);
            } else {
                underwearData[gIdx].items[sIdx].qty = Math.max(0, (underwearData[gIdx].items[sIdx].qty || 0) + delta);
            }
            renderInputs();
        }

        /* 生成與網站預覽完全一模一樣的獨立 HTML 結構，保證截圖百分之百一致 */
        function generateExactCardHtml() {
            let cTotal = 0;
            const cValid = clothesData.filter(g => (g.model || '').trim() && g.items.length > 0);
            let clothesRowsHtml = '';
            if (cValid.length === 0) {
                clothesRowsHtml = `<tr><td colspan="3" style="padding: 4px 6px; color: #94a3b8; font-size: 12px; font-weight: 700;">無叫貨品項</td></tr>`;
            } else {
                clothesRowsHtml = cValid.map((g, i) => {
                    let gSum = 0;
                    const specHtml = g.items.map(sub => {
                        gSum += Number(sub.qty || 0);
                        return `<span style="display: inline-block; white-space: nowrap; margin-right: 5px; margin-bottom: 2px;">${sub.size}${sub.color}(${sub.qty}件)</span>`;
                    }).join('');
                    cTotal += gSum;
                    const bg = (i % 2 === 0) ? '#ffffff' : '#f8fafc';
                    return `
                        <tr style="background-color: ${bg};">
                            <td style="width: 20%; background-color: #fbcfe8; font-weight: 700; font-size: 13px; color: #0f172a; border: 1.5px solid #0f172a; padding: 4px 6px; text-align: center;">${g.model}</td>
                            <td style="width: 62%; text-align: left; padding: 4px 6px; font-weight: 700; font-size: 13px; color: #0f172a; line-height: 1.5; border: 1.5px solid #0f172a;">${specHtml}</td>
                            <td style="width: 18%; font-weight: 900; font-size: 13px; color: #0f172a; border: 1.5px solid #0f172a; padding: 4px 6px; text-align: center;">${gSum}件</td>
                        </tr>
                    `;
                }).join('');
            }

            let uTotal = 0;
            const uValid = underwearData.filter(g => (g.model || '').trim() && g.items.length > 0);
            let underwearRowsHtml = '';
            if (uValid.length === 0) {
                underwearRowsHtml = `<tr><td colspan="3" style="padding: 4px 6px; color: #94a3b8; font-size: 12px; font-weight: 700;">無叫貨品項</td></tr>`;
            } else {
                underwearRowsHtml = uValid.map((g, i) => {
                    let gSum = 0;
                    const specHtml = g.items.map(sub => {
                        gSum += Number(sub.qty || 0);
                        return `<span style="display: inline-block; white-space: nowrap; margin-right: 5px; margin-bottom: 2px;">${sub.size}(${sub.qty}打)</span>`;
                    }).join('');
                    uTotal += gSum;
                    const bg = (i % 2 === 0) ? '#ffffff' : '#f8fafc';
                    return `
                        <tr style="background-color: ${bg};">
                            <td style="width: 20%; background-color: #fef08a; font-weight: 700; font-size: 13px; color: #0f172a; border: 1.5px solid #0f172a; padding: 4px 6px; text-align: center;">${g.model}</td>
                            <td style="width: 62%; text-align: left; padding: 4px 6px; font-weight: 700; font-size: 13px; color: #0f172a; line-height: 1.5; border: 1.5px solid #0f172a;">${specHtml}</td>
                            <td style="width: 18%; font-weight: 900; font-size: 13px; color: #0f172a; border: 1.5px solid #0f172a; padding: 4px 6px; text-align: center;">${gSum}打</td>
                        </tr>
                    `;
                }).join('');
            }

            const logisticsVal = document.getElementById('logistics-select').value;
            const locationVal = document.getElementById('location-input').value || '新莊';
            const deliveryReq = document.getElementById('delivery-requirement').value;
            const dateVal = document.getElementById('order-date').value;
            let dateText = '--';
            if (dateVal) {
                const d = new Date(dateVal);
                dateText = `${d.getMonth() + 1}月${d.getDate()}日`;
            }

            return `
                <div id="modal-export-card" style="width: 360px; min-width: 360px; max-width: 360px; background-color: #ffffff; border: 2px solid #0f172a; border-radius: 12px; padding: 8px; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif;">
                    <table style="width: 100%; border-collapse: collapse; table-layout: fixed; background-color: #ffffff; margin: 0;">
                        <thead>
                            <tr style="background-color: #0284c7; color: #ffffff; font-weight: 900; font-size: 13px;">
                                <th style="width: 20%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">型號</th>
                                <th style="width: 62%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">尺寸-顏色</th>
                                <th style="width: 18%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">數量</th>
                            </tr>
                        </thead>
                        <tbody>${clothesRowsHtml}</tbody>
                        <tfoot>
                            <tr style="background-color: #fce7f3; font-weight: 900;">
                                <td style="width: 20%; color: #dc2626; font-size: 13px; border: 1.5px solid #0f172a; padding: 4px 2px; text-align: center;">合計</td>
                                <td style="width: 62%; border: 1.5px solid #0f172a; padding: 4px 2px;"></td>
                                <td style="width: 18%; color: #dc2626; font-size: 14px; border: 1.5px solid #0f172a; padding: 4px 2px; text-align: center;">${cTotal}件</td>
                            </tr>
                        </tfoot>
                    </table>

                    <table style="width: 100%; border-collapse: collapse; table-layout: fixed; background-color: #ffffff; margin: 0; border-top: 0;">
                        <thead>
                            <tr style="background-color: #0284c7; color: #ffffff; font-weight: 900; font-size: 13px;">
                                <th style="width: 20%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">型號</th>
                                <th style="width: 62%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">內褲尺寸</th>
                                <th style="width: 18%; border: 1.5px solid #0f172a; padding: 5px 2px; text-align: center;">數量</th>
                            </tr>
                        </thead>
                        <tbody>${underwearRowsHtml}</tbody>
                        <tfoot>
                            <tr style="background-color: #fce7f3; font-weight: 900;">
                                <td style="width: 20%; color: #dc2626; font-size: 13px; border: 1.5px solid #0f172a; padding: 4px 2px; text-align: center;">合計</td>
                                <td style="width: 62%; border: 1.5px solid #0f172a; padding: 4px 2px;"></td>
                                <td style="width: 18%; color: #dc2626; font-size: 14px; border: 1.5px solid #0f172a; padding: 4px 2px; text-align: center;">${uTotal}打</td>
                            </tr>
                        </tfoot>
                    </table>

                    <div style="display: flex; border: 1.5px solid #0f172a; border-top: 0; background-color: #fffbeb; text-align: center; font-size: 12px; font-weight: 900; color: #0f172a; margin: 0; padding: 0; box-sizing: border-box;">
                        <div style="flex: 1; padding: 6px 2px; border-right: 1.5px solid #0f172a; color: #dc2626; font-size: 13px; font-weight: 900; white-space: nowrap; display: flex; align-items: center; justify-content: center;">
                            ${deliveryReq}
                        </div>
                        <div style="flex: 1.2; padding: 6px 2px; border-right: 1.5px solid #0f172a; white-space: nowrap; font-size: 11px; display: flex; align-items: center; justify-content: center;">
                            寄「${locationVal}」〔${logisticsVal}〕
                        </div>
                        <div style="flex: 1; padding: 6px 2px; color: #1e293b; font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; justify-content: center;">
                            ${dateText}
                        </div>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const wrapper = document.getElementById('preview-card-wrapper');
            wrapper.innerHTML = generateExactCardHtml();
        }

        document.getElementById('logistics-select').addEventListener('change', updatePreview);
        document.getElementById('location-input').addEventListener('input', updatePreview);
        document.getElementById('order-date').addEventListener('change', updatePreview);
        document.getElementById('delivery-requirement').addEventListener('change', updatePreview);

        async function copyImageToClipboardOnly() {
            updatePreview();
            const card = document.getElementById('modal-export-card');
            try {
                const canvas = await html2canvas(card, { 
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    width: 360,
                    windowWidth: 360
                });
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        showToast("生成圖片失敗，請重試", "fa-triangle-exclamation", "text-amber-400");
                        return;
                    }
                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast("已成功複製叫貨圖！至 LINE 貼上即可", "fa-circle-check", "text-emerald-400");
                    } catch (clipboardErr) {
                        showToast("您的瀏覽器限制自動剪貼，請長按預覽圖複製", "fa-triangle-exclamation", "text-amber-400");
                    }
                }, 'image/png');
            } catch (e) {
                showToast("圖片渲染失敗", "fa-triangle-exclamation", "text-amber-400");
            }
        }

        async function downloadImageFile() {
            updatePreview();
            const card = document.getElementById('modal-export-card');
            try {
                const canvas = await html2canvas(card, { 
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    width: 360,
                    windowWidth: 360 
                });
                const url = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = url;
                a.download = `叫貨單_${document.getElementById('order-date').value || '最新'}.png`;
                a.click();
                showToast("已為您下載叫貨單圖片！", "fa-download", "text-sky-400");
            } catch (e) {
                showToast("下載失敗，請重新操作", "fa-triangle-exclamation", "text-amber-400");
            }
        }

        function finishOrderAndSaveHistory() {
            let cTotal = 0;
            clothesData.forEach(g => g.items.forEach(i => cTotal += Number(i.qty || 0)));
            let uTotal = 0;
            underwearData.forEach(g => g.items.forEach(i => uTotal += Number(i.qty || 0)));

            if (cTotal === 0 && uTotal === 0) {
                showToast("目前沒有任何叫貨品項，無法完成！", "fa-triangle-exclamation", "text-amber-400");
                return;
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            const record = {
                id: Date.now(),
                timestamp: timeStr,
                orderDate: document.getElementById('order-date').value,
                logistics: document.getElementById('logistics-select').value,
                location: document.getElementById('location-input').value || '新莊',
                deliveryReq: document.getElementById('delivery-requirement').value,
                clothesData: JSON.parse(JSON.stringify(clothesData)),
                underwearData: JSON.parse(JSON.stringify(underwearData)),
                clothesTotal: cTotal,
                underwearTotal: uTotal
            };

            historyRecords.unshift(record);
            saveCloudHistory();
            togglePreviewModal(false);
        }

        function toggleHistoryModal(show) {
            const modal = document.getElementById('history-modal');
            if (show) {
                document.getElementById('history-search-input').value = '';
                fetchCloudHistory();
                renderHistoryList();
                modal.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list-container');
            const keyword = (document.getElementById('history-search-input')?.value || '').trim().toLowerCase();

            const filteredRecords = historyRecords.filter(item => {
                if (!keyword) return true;
                const searchTarget = [
                    item.timestamp, item.logistics, item.location, item.deliveryReq,
                    item.clothesTotal + '件', item.underwearTotal + '打',
                    ...item.clothesData.map(g => g.model + ' ' + g.items.map(sub => sub.size + (sub.color||'') + sub.qty).join('')),
                    ...item.underwearData.map(g => g.model + ' ' + g.items.map(sub => sub.size + sub.qty).join(''))
                ].join(' ').toLowerCase();
                return searchTarget.includes(keyword);
            });

            if (filteredRecords.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400 space-y-2">
                        <i class="fa-solid fa-box-open text-3xl text-slate-300"></i>
                        <p class="text-sm font-bold">${historyRecords.length === 0 ? '尚無任何雲端歷史紀錄' : '找不到符合搜尋條件的紀錄'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredRecords.map((item) => {
                const clothesSummary = item.clothesData.map(g => `${g.model}(${g.items.reduce((a,b)=>a+Number(b.qty||0),0)}件)`).join('、');
                const underwearSummary = item.underwearData.length > 0 ? item.underwearData.map(g => `${g.model}(${g.items.reduce((a,b)=>a+Number(b.qty||0),0)}打)`).join('、') : '';
                const fullSummaryText = [clothesSummary, underwearSummary].filter(Boolean).join(' / ');

                return `
                    <div class="bg-white rounded-xl p-3 border-2 border-slate-200 shadow-xs flex items-center justify-between gap-2 hover:border-slate-400 transition">
                        <div class="min-w-0 flex-1 cursor-pointer" onclick="showHistoryDetail(${item.id})" title="點擊查看詳細資料">
                            <div class="flex items-center gap-2 text-xs font-bold text-slate-500 flex-wrap">
                                <span class="text-slate-900 font-extrabold"><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${item.timestamp}</span>
                                <span class="bg-red-50 text-red-600 px-1.5 py-0.5 rounded font-bold">${item.deliveryReq}</span>
                                <span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded">寄「${item.location}」</span>
                            </div>
                            <div class="text-sm font-bold text-slate-900 truncate mt-1">
                                <span class="text-pink-600 mr-1.5">${item.clothesTotal}件</span><span class="text-amber-600 mr-2.5">${item.underwearTotal}打</span>
                                <span class="text-slate-500 font-normal text-xs">${fullSummaryText}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="showHistoryDetail(${item.id})" title="查看詳細資料" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs transition active:scale-95 border border-slate-200 cursor-pointer">
                                詳情
                            </button>
                            <button onclick="reloadHistoryToEdit(${item.id})" title="載入編輯區" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-2.5 py-1.5 rounded-xl text-xs transition active:scale-95 cursor-pointer">
                                載入
                            </button>
                            <button onclick="deleteHistoryRecord(${item.id})" title="刪除" class="text-slate-400 hover:text-red-500 p-1 text-sm transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showHistoryDetail(id) {
            const item = historyRecords.find(r => r.id === id);
            if (!item) return;

            const body = document.getElementById('detail-content-body');
            let clothesHtml = item.clothesData && item.clothesData.length > 0 ? `
                <div class="space-y-1.5">
                    <div class="font-black text-slate-800 flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-pink-500 inline-block"></span> 衣褲類明細</div>
                    <div class="bg-white rounded-xl p-3 border-2 border-slate-200 space-y-2">
                        ${item.clothesData.map(g => `
                            <div class="text-xs border-b border-slate-100 pb-1.5 space-y-1">
                                <div class="font-black text-slate-900 text-sm">${g.model}</div>
                                <div class="text-slate-700 font-bold pl-2 leading-relaxed">${g.items.map(sub => `${sub.size} ${sub.color || ''} (${sub.qty}件)`).join('、')}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            let underwearHtml = item.underwearData && item.underwearData.length > 0 ? `
                <div class="space-y-1.5">
                    <div class="font-black text-slate-800 flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 內褲類明細</div>
                    <div class="bg-white rounded-xl p-3 border-2 border-slate-200 space-y-2">
                        ${item.underwearData.map(g => `
                            <div class="text-xs border-b border-slate-100 pb-1.5 space-y-1">
                                <div class="font-black text-slate-900 text-sm">${g.model}</div>
                                <div class="text-slate-700 font-bold pl-2 leading-relaxed">${item.underwearData.map(sub => `${sub.size} (${sub.qty}打)`).join('、')}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            body.innerHTML = `
                <div class="bg-white p-3 rounded-xl border-2 border-slate-200 space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-500 border-b border-slate-200 pb-2">
                        <span>時間：${item.timestamp}</span><span class="text-red-600 font-black">${item.deliveryReq}</span>
                    </div>
                    <div class="text-xs font-bold text-slate-900 space-y-1">
                        <div>物流單位：<span class="text-indigo-600 font-black">${item.logistics}</span></div>
                        <div>目的地點：<span class="text-indigo-600 font-black">${item.location}</span></div>
                        <div>叫貨日期：<span class="text-slate-700">${item.orderDate || '未指定'}</span></div>
                        <div>叫貨總計：<span class="text-pink-600">${item.clothesTotal}件</span> / <span class="text-amber-600">${item.underwearTotal}打</span></div>
                    </div>
                </div>
                ${clothesHtml} ${underwearHtml}
            `;

            document.getElementById('detail-reload-btn').onclick = function() {
                reloadHistoryToEdit(item.id);
                toggleDetailModal(false);
            };
            toggleDetailModal(true);
        }

        function toggleDetailModal(show) {
            const modal = document.getElementById('detail-modal');
            if (show) modal.classList.remove('opacity-0', 'pointer-events-none');
            else modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function deleteHistoryRecord(id) {
            historyRecords = historyRecords.filter(r => r.id !== id);
            saveCloudHistory();
            renderHistoryList();
            showToast("已刪除該筆歷史紀錄", "fa-trash-can", "text-amber-400");
        }

        function clearAllHistory() {
            if (historyRecords.length === 0) return;
            historyRecords = [];
            saveCloudHistory();
            renderHistoryList();
            showToast("歷史紀錄已清空", "fa-trash-can", "text-amber-400");
        }

        function reloadHistoryToEdit(id) {
            const item = historyRecords.find(r => r.id === id);
            if (!item) return;

            clothesData = JSON.parse(JSON.stringify(item.clothesData));
            underwearData = JSON.parse(JSON.stringify(item.underwearData));
            document.getElementById('logistics-select').value = item.logistics || '大榮貨運';
            document.getElementById('location-input').value = item.location || '新莊';
            document.getElementById('delivery-requirement').value = item.deliveryReq || '明日到';
            if (item.orderDate) document.getElementById('order-date').value = item.orderDate;

            renderInputs();
            toggleHistoryModal(false);
            toggleDetailModal(false);
            showToast("已將歷史叫貨單載入編輯區！", "fa-check", "text-emerald-400");
        }

        window.onload = function() {
            loadMemory();
        };
    </script>
</body>
</html>
